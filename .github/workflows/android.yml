# Builds the Android APKs (android/) on every push that touches them or the
# bot files, and on demand (Actions → Android APK → Run workflow). Two
# artifacts land on the run page:
#   nexa-ai-bot-release-apk — app-release.apk: the build to install. Not
#     debuggable, no remote WebView inspection, code shrunk by R8.
#   nexa-ai-bot-debug-apk   — app-debug.apk: for chrome://inspect only.
# Download, unzip, copy the APK to the phone, install (allow unknown sources).
#
# Signing: with the four repository secrets below the release APK is signed
# with your own key, so every build installs over the previous one. Without
# them it is signed with the debug key of the runner — a fresh key per run,
# so the phone wants the old build uninstalled before each new one.
#   ANDROID_KEYSTORE_BASE64    the keystore file, base64 (base64 -w0 release.keystore)
#   ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD
# android/keystore.properties.example says how to create the key.
name: Android APK

on:
  push:
    branches: [master]
    paths:
      - 'android/**'
      - '*.js'
      - '*.css'
      - '*.html'
      - 'icons/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    env:
      KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # No Gradle wrapper is committed (its jar is a binary); the action
      # provides the Gradle version instead.
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Release signing key (only with the repository secrets)
        if: env.KEYSTORE_BASE64 != ''
        working-directory: android
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > release.keystore
          {
            echo "storeFile=release.keystore"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > keystore.properties

      - name: Build APKs
        working-directory: android
        run: gradle assembleDebug assembleRelease --no-daemon --console=plain

      - uses: actions/upload-artifact@v4
        with:
          name: nexa-ai-bot-release-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: nexa-ai-bot-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
